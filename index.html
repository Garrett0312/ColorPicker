<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Picker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #ff0000;
  display: flex;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  transition: background-color 0.1s;
  font-family: system-ui, sans-serif;
  min-height: 300px;
}
.panel-wheel {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.panel-controls {
  flex: 1;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2.5vh;
  padding: 4vw;
}
label {
  font-size: 1.8vh;
  font-weight: 600;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
input[type="text"] {
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 0.8vh;
  color: #e8e8e8;
  font-size: 2.2vh;
  padding: 1.2vh 1.5vh;
  width: 100%;
  outline: none;
  transition: border-color 0.15s;
  font-family: monospace;
}
input[type="text"]:focus { border-color: #5c6ef8; min-width: 0;}
.input-group { display: flex; flex-direction: column; gap: 0.6vh; min-width: 0;}
.three-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5vh; width: 100%; min-width: 0;}
.color-preview-row { display: flex; align-items: center; gap: 1.5vh; width: 100%; }
.color-swatch {
  width: 6vh; height: 6vh;
  border-radius: 1vh;
  border: 2px solid rgba(255,255,255,0.15);
  flex-shrink: 0;
}
.copy-btn {
  flex: 1;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 0.8vh;
  color: #ccc;
  font-size: 2.2vh;
  padding: 1.2vh 1.5vh;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  text-align: center;
  font-family: monospace;
}
.copy-btn:hover { background: rgba(255,255,255,0.1); border-color: #5c6ef8; color: #fff; }
.copy-btn.copied { border-color: #4caf6e; color: #4caf6e; }
.section-label {
  font-size: 1.4vh;
  font-weight: 600;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: -1vh;
}
@media (orientation: portrait) {
  body {
    flex-direction: column;
    height: auto;
    /*min-height: 100vh;*/
    overflow-y: auto;
  }
  .panel-wheel {
    flex: none;
    width: 100%;
    padding: 4vw 0 0;
  }
  .panel-controls {
    flex: none;
    width: 100%;
    padding: 4vw 6vw 6vw;
    gap: 2.5vw;
  }
}
</style>
</head>
<body>

<div class="panel-wheel">
  <canvas id="wheel-canvas"></canvas>
</div>

<div class="panel-controls">
  <div class="color-preview-row">
    <div class="color-swatch" id="swatch"></div>
    <button class="copy-btn" id="copy-hex">#FF0000</button>
  </div>

  <div class="input-group">
    <label>Hex</label>
    <input type="text" id="hex-input" placeholder="#FF0000" maxlength="7">
  </div>

  <div class="section-label">RGB</div>
  <div class="three-inputs">
    <div class="input-group"><label>R</label><input type="text" id="r-input" maxlength="3"></div>
    <div class="input-group"><label>G</label><input type="text" id="g-input" maxlength="3"></div>
    <div class="input-group"><label>B</label><input type="text" id="b-input" maxlength="3"></div>
  </div>

  <div class="section-label">HSV</div>
  <div class="three-inputs">
    <div class="input-group"><label>H</label><input type="text" id="h-input" maxlength="3"></div>
    <div class="input-group"><label>S</label><input type="text" id="s-input" maxlength="3"></div>
    <div class="input-group"><label>V</label><input type="text" id="v-input" maxlength="3"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('wheel-canvas');
const ctx = canvas.getContext('2d');

let hue = 0, sat = 1, val = 0.5;
let dragging = null;
let W, H, cx, cy, outerR, innerR, ringMid, boxSize, boxX, boxY, handleR, boxHandleR;
const WHEEL_OFFSET = 90; // degrees — change this to rotate the wheel

function resize() {
  const isPortrait = window.innerHeight > window.innerWidth;
  const size = isPortrait
  ? Math.round(Math.min(window.innerWidth * 0.90, window.innerHeight * 0.52))
  : Math.round(Math.min(window.innerWidth * 0.48, window.innerHeight * 0.85));
  canvas.width = size;
  canvas.height = size;
  W = H = size;
  cx = cy = size / 2;
  outerR = Math.round(size * 0.47);
  innerR = Math.round(size * 0.39);
  ringMid = (outerR + innerR) / 2;
  boxSize = Math.floor(innerR * Math.SQRT2 * 0.76);
  boxX = cx - boxSize / 2;
  boxY = cy - boxSize / 2;
  handleR = size * 0.036;
  boxHandleR = size * 0.028;
  draw();
}

window.addEventListener('resize', resize);

function hsvToRgb(h, s, v) {
  const i = Math.floor(h / 60) % 6;
  const f = h / 60 - Math.floor(h / 60);
  const p = v*(1-s), q = v*(1-f*s), t = v*(1-(1-f)*s);
  const comps = [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i];
  return { r: Math.round(comps[0]*255), g: Math.round(comps[1]*255), b: Math.round(comps[2]*255) };
}

function rgbToHsv(r, g, b) {
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0, s=max===0?0:d/max, v=max;
  if(d!==0){
    if(max===r) h=((g-b)/d)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h=Math.round(h*60); if(h<0) h+=360;
  }
  return { h, s, v };
}

function toHex(r,g,b){ return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }

function drawWheel() {
  const offsetRad = WHEEL_OFFSET * Math.PI / 180;
  for (let i = 0; i < 360; i++) {
    const a1 = (i / 360) * Math.PI * 2 - Math.PI / 2 + offsetRad;
    const a2 = ((i + 1.5) / 360) * Math.PI * 2 - Math.PI / 2 + offsetRad;
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, a1, a2);
    ctx.arc(cx, cy, innerR, a2, a1, true);
    ctx.closePath();
    ctx.fillStyle = `hsl(${360 - i},100%,50%)`;
    ctx.fill();
  }
}

function drawBox() {
  const { r, g, b } = hsvToRgb(hue, 1, 1);
  const gH = ctx.createLinearGradient(boxX, 0, boxX + boxSize, 0);
  gH.addColorStop(0, '#ffffff');
  gH.addColorStop(1, `rgb(${r},${g},${b})`);
  ctx.fillStyle = gH;
  ctx.fillRect(boxX, boxY, boxSize, boxSize);
  const gV = ctx.createLinearGradient(0, boxY, 0, boxY + boxSize);
  gV.addColorStop(0, 'rgba(0,0,0,0)');
  gV.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = gV;
  ctx.fillRect(boxX, boxY, boxSize, boxSize);
}

function drawHandles() {
  const wa = -(hue / 360) * Math.PI * 2 - Math.PI / 2 + (WHEEL_OFFSET * Math.PI / 180);
  const wx = cx + ringMid * Math.cos(wa);
  const wy = cy + ringMid * Math.sin(wa);
  ctx.beginPath();
  ctx.arc(wx, wy, handleR, 0, Math.PI * 2);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  //console.log('wa:',wa,'wx:',wx,'wy:',wy);

  const bx = boxX + sat * boxSize;
  const by = boxY + (1 - val) * boxSize;
  ctx.beginPath();
  ctx.arc(bx, by, boxHandleR, 0, Math.PI * 2);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.5;
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawWheel();
  drawBox();
  drawHandles();
}

function updateInputs() {
  const { r, g, b } = hsvToRgb(hue, sat, val);
  const hex = toHex(r, g, b);
  document.getElementById('hex-input').value = hex;
  document.getElementById('r-input').value = r;
  document.getElementById('g-input').value = g;
  document.getElementById('b-input').value = b;
  document.getElementById('h-input').value = Math.round(hue);
  document.getElementById('s-input').value = Math.round(sat * 100);
  document.getElementById('v-input').value = Math.round(val * 100);
  document.getElementById('swatch').style.backgroundColor = hex;
  document.body.style.backgroundColor = hex;
  const btn = document.getElementById('copy-hex');
  btn.textContent = hex.toUpperCase();
  btn.classList.remove('copied');
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - rect.left) * (W / rect.width), y: (src.clientY - rect.top) * (H / rect.height) };
}

function inWheel(x, y) {
  const d = Math.hypot(x - cx, y - cy);
  return d >= innerR && d <= outerR;
}

function inBox(x, y) {
  return x >= boxX && x <= boxX + boxSize && y >= boxY && y <= boxY + boxSize;
}

function handleWheel(x, y) {
  //hue = ((Math.atan2(y - cy, x - cx) + Math.PI / 2 - (WHEEL_OFFSET * Math.PI / 180)) / (Math.PI * 2) * 360 + 720) % 360;
  hue = ((Math.atan2(-(y - cy), x - cx) + Math.PI / 2 - (WHEEL_OFFSET * Math.PI / 180)) / (Math.PI * 2) * 360 + 720) % 360;
  //console.log(hue);
  draw(); updateInputs();
}

function handleBox(x, y) {
  sat = Math.max(0, Math.min(1, (x - boxX) / boxSize));
  val = Math.max(0, Math.min(1, 1 - (y - boxY) / boxSize));
  draw(); updateInputs();
}

canvas.addEventListener('mousedown', e => {
  const p = getPos(e);
  if (inWheel(p.x, p.y)) { dragging = 'wheel'; handleWheel(p.x, p.y); }
  else if (inBox(p.x, p.y)) { dragging = 'box'; handleBox(p.x, p.y); }
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const p = getPos(e);
  dragging === 'wheel' ? handleWheel(p.x, p.y) : handleBox(p.x, p.y);
});
window.addEventListener('mouseup', () => dragging = null);
canvas.addEventListener('touchstart', e => { e.preventDefault(); const p=getPos(e); if(inWheel(p.x,p.y)){dragging='wheel';handleWheel(p.x,p.y);}else if(inBox(p.x,p.y)){dragging='box';handleBox(p.x,p.y);} }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); if(!dragging)return; const p=getPos(e); dragging==='wheel'?handleWheel(p.x,p.y):handleBox(p.x,p.y); }, {passive:false});
window.addEventListener('touchend', () => dragging = null);

document.getElementById('hex-input').addEventListener('change', function() {
  const v = this.value.trim();
  const hex = v.startsWith('#') ? v : '#' + v;
  if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    const hsv = rgbToHsv(r,g,b); hue=hsv.h; sat=hsv.s; val=hsv.v;
    draw(); updateInputs();
  }
});

function applyRGB() {
  const clamp = (n,mn,mx)=>Math.max(mn,Math.min(mx,parseInt(n)||0));
  const hsv = rgbToHsv(clamp(document.getElementById('r-input').value,0,255),clamp(document.getElementById('g-input').value,0,255),clamp(document.getElementById('b-input').value,0,255));
  hue=hsv.h; sat=hsv.s; val=hsv.v; draw(); updateInputs();
}
function applyHSV() {
  const clamp=(n,mn,mx)=>Math.max(mn,Math.min(mx,parseInt(n)||0));
  hue=clamp(document.getElementById('h-input').value,0,360);
  sat=clamp(document.getElementById('s-input').value,0,100)/100;
  val=clamp(document.getElementById('v-input').value,0,100)/100;
  draw(); updateInputs();
}

['r-input','g-input','b-input'].forEach(id=>document.getElementById(id).addEventListener('change',applyRGB));
['h-input','s-input','v-input'].forEach(id=>document.getElementById(id).addEventListener('change',applyHSV));

document.getElementById('copy-hex').addEventListener('click', function() {
  const hex = document.getElementById('hex-input').value.toUpperCase();
  navigator.clipboard.writeText(hex).then(() => {
    this.textContent = 'Copied!'; this.classList.add('copied');
    setTimeout(() => { this.textContent = hex; this.classList.remove('copied'); }, 1500);
  });
});

resize();
updateInputs();
</script>
</body>
</html>
